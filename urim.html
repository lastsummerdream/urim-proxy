<script>

   Claude API 연결 설정
   ---------------------------------------------------------------------
   비워 두면 AI 없이 기록 검색과 키워드 뽑기만 동작합니다.
   둘 중 하나만 채우세요. 자세한 방법은 README.md를 보세요.

   [방법 A · 권장] proxyUrl
     API 키를 서버(예: Cloudflare Worker)에 숨기고 그 주소만 적습니다.
     함께 들어 있는 worker.js를 그대로 배포하면 됩니다.

   [방법 B · 개인 테스트용] apiKey
     키를 여기에 직접 적습니다. 이 파일을 공개 저장소(GitHub Pages)에

   ===================================================================== */
window.URIM_CONFIG = {
  proxyUrl: "",                    // 예: "https://urim-proxy.아이디.workers.dev"

  model: "claude-sonnet-5-5",      // 답변과 캐릭터 콘셉트에 쓰는 모델
  quickModel: "claude-haiku-5-5",  // 느낌 읽기, 짧은 답에 쓰는 빠른 모델

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Michroma&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@400;600&display=swap">
<style>
/* Layout: 코버넌트 기록 질의 단말 — 상단 헤더, 가운데 대화 기록(760px 열), 하단 고정 입력부. 잔광 단말 사이트와 같은 검정·실버 톤 */
:root{
  --void:#000000;
  --panel:#111316;
  --panel-2:#181a1e;
  --glass:rgba(232,238,244,.075);
  --glass-hi:rgba(232,238,244,.14);
  --sep:rgba(232,238,244,.10);
  --text:#f2f4f6;
  --text-2:#9aa1a9;
  --text-3:#646b73;
  --silver:#dfe4e9;
  --ink:#0b0c0e;
  --f-ui:"IBM Plex Sans KR",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-tech:"Michroma","Eurostile","Arial Black",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --f-serif:"Noto Serif KR","AppleMyungjo",serif;
  --col:760px;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{height:100%;background:var(--void)}
body{margin:0;color:var(--text);font-family:var(--f-ui);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
:focus-visible{outline:1.5px solid var(--silver);outline-offset:2px}
.inner{max-width:var(--col);margin-inline:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

.app{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr) auto;grid-template-columns:minmax(0,1fr)}
.app > *{min-width:0}

/* header */
.top{border-bottom:1px solid var(--sep);background:var(--void)}
.top .inner{display:flex;align-items:center;gap:12px;padding-block:12px}
.logo{flex:none;width:38px;height:38px;border-radius:28%;display:grid;place-items:center;background:linear-gradient(150deg,#30353b 0%,#15181b 55%,#0a0b0d 100%);box-shadow:inset 0 1px 0 rgba(255,255,255,.22),0 6px 16px rgba(0,0,0,.5)}
.logo svg,.av svg{width:58%;height:58%;fill:none;stroke:var(--silver);stroke-width:1.6}
.brand{flex:1;min-width:0}
.brand b{display:block;font-family:var(--f-tech);font-weight:400;font-size:15px;letter-spacing:.2em}
.brand span{display:block;font-size:12px;color:var(--text-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.aitog{flex:none;display:flex;align-items:center;gap:8px;padding:6px 6px 6px 12px;border-radius:999px;background:var(--glass);font-size:12.5px;color:var(--text-2)}
.aitog .sw{width:34px;height:20px;border-radius:999px;background:var(--glass-hi);position:relative;transition:background .2s}
.aitog .sw::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:var(--text-2);transition:transform .2s,background .2s}
.aitog[aria-pressed="true"]{color:var(--text)}
.aitog[aria-pressed="true"] .sw{background:var(--silver)}
.aitog[aria-pressed="true"] .sw::after{transform:translateX(14px);background:var(--ink)}

/* log */
.log{overflow-y:auto;overscroll-behavior:contain;scrollbar-width:thin;scrollbar-color:var(--glass-hi) transparent}
.log .inner{padding-block:24px 28px;display:flex;flex-direction:column;gap:22px}
.msg{display:flex;gap:10px;align-items:flex-start;min-width:0}
.msg.me{justify-content:flex-end}
.av{flex:none;width:28px;height:28px;border-radius:28%;display:grid;place-items:center;background:linear-gradient(150deg,#30353b 0%,#15181b 55%,#0a0b0d 100%);box-shadow:inset 0 1px 0 rgba(255,255,255,.2);margin-top:2px}
.body{flex:1;min-width:0;display:flex;flex-direction:column;gap:12px}
.me .bubble{max-width:82%;background:var(--silver);color:var(--ink);padding:9px 14px;border-radius:18px 18px 4px 18px;font-weight:500;white-space:pre-wrap;word-break:break-word}
.say{white-space:normal;word-break:break-word}
.say p{margin:0 0 8px}
.say p:last-child{margin-bottom:0}
.say ul{margin:4px 0 8px;padding-left:18px}
.say li{margin:2px 0}
.say strong{font-weight:600;color:var(--text)}
.say .dim{color:var(--text-2)}
.say code{font-family:var(--f-mono);font-size:13px;background:var(--glass);padding:1px 6px;border-radius:5px}
.thinking{color:var(--text-2);font-size:14px;display:flex;align-items:center;gap:8px}
.thinking i{width:6px;height:6px;border-radius:50%;background:var(--silver);animation:pulse 1.2s ease-in-out infinite}
.thinking i:nth-child(2){animation-delay:.2s}.thinking i:nth-child(3){animation-delay:.4s}
@keyframes pulse{0%,100%{opacity:.25}50%{opacity:1}}
.note{font-size:12.5px;color:var(--text-3)}
.ai-tag{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.1em;color:var(--text-3)}
.refs-h{font-family:var(--f-mono);font-size:11px;letter-spacing:.1em;color:var(--text-3);text-transform:uppercase;margin-top:2px}

/* chips */
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:5px 11px;border-radius:999px;background:var(--glass);font-size:13px;color:var(--text);transition:background .15s;white-space:nowrap}
.chip:hover{background:var(--glass-hi)}
.chip.go{background:var(--silver);color:var(--ink);font-weight:500}
.chip.hash{font-family:var(--f-mono);font-size:12px;color:var(--text-2)}

/* result card */
.rcard{background:var(--panel);border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:8px;min-width:0}
.rsec{font-family:var(--f-mono);font-size:11px;color:var(--text-3);letter-spacing:.04em}
.rtitle{font-weight:600;font-size:16.5px;line-height:1.35}
.rtitle small{font-family:var(--f-tech);font-weight:400;font-size:9.5px;letter-spacing:.16em;color:var(--text-2);margin-left:8px;vertical-align:2px}
.rtext{font-size:14.5px;color:var(--text);margin:0}
.rtext.clip{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
mark{background:rgba(223,228,233,.24);color:var(--text);border-radius:3px;padding:0 2px}
.more{align-self:flex-start;font-size:12.5px;color:var(--text-2)}
.more:hover{color:var(--text)}

/* OC card */
.oc{background:var(--panel);border-radius:18px;overflow:hidden;min-width:0}
.ochead{background:var(--silver);color:var(--ink);padding:12px 16px;display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.ochead b{font-family:var(--f-tech);font-weight:400;font-size:11px;letter-spacing:.18em}
.ochead span{font-family:var(--f-mono);font-size:11px}
.ocrows{display:flex;flex-direction:column}
.ocrow{display:grid;grid-template-columns:76px minmax(0,1fr) 34px;gap:10px;align-items:start;padding:11px 10px 11px 16px;position:relative}
.ocrow + .ocrow::before{content:"";position:absolute;top:0;left:16px;right:0;height:.5px;background:var(--sep)}
.ocrow .lab{font-family:var(--f-mono);font-size:11px;color:var(--text-3);letter-spacing:.06em;padding-top:3px}
.ocrow .val b{display:block;font-weight:500;font-size:15px;line-height:1.45}
.ocrow .val span{display:block;font-size:12.5px;color:var(--text-2);line-height:1.5;margin-top:1px}
.ocrow.locked{background:rgba(223,228,233,.05)}
.lock{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;color:var(--text-3)}
.lock:hover{background:var(--glass)}
.lock svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.lock[aria-pressed="true"]{color:var(--ink);background:var(--silver)}
.lock .closed,.lock[aria-pressed="true"] .open{display:none}
.lock[aria-pressed="true"] .closed{display:block}
.ocfoot{padding:12px 16px 14px;border-top:.5px solid var(--sep);display:flex;flex-direction:column;gap:12px}
.ocact{display:flex;flex-wrap:wrap;gap:8px}
.btn{padding:8px 14px;border-radius:11px;background:var(--glass-hi);font-size:13.5px;font-weight:500;display:inline-flex;align-items:center;gap:6px}
.btn:hover{background:rgba(232,238,244,.2)}
.btn.pri{background:var(--silver);color:var(--ink)}
.btn.pri:hover{background:#fff}
.btn svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.btn:disabled{opacity:.45;cursor:default}
.ocnote{font-size:12px;color:var(--text-3)}
.plain{font-family:var(--f-mono);font-size:12px;white-space:pre-wrap;background:var(--void);border-radius:10px;padding:10px;user-select:all;-webkit-user-select:all}
.concept{border-top:.5px solid var(--sep);padding:14px 16px}
.vibe{padding:12px 16px;border-bottom:.5px solid var(--sep);display:flex;flex-direction:column;gap:8px}
.vibe .vl{font-family:var(--f-mono);font-size:11px;color:var(--text-3);letter-spacing:.06em}
.vibe .vt{display:flex;flex-wrap:wrap;gap:6px}
.vibe .vt span{padding:3px 10px;border-radius:999px;background:var(--glass-hi);font-size:12.5px}
.vibe .one{font-family:var(--f-serif);font-size:15px;line-height:1.6;color:var(--text)}

/* calc card */
.calc{background:var(--panel);border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.calc .eq{font-family:var(--f-mono);font-size:15px}
.calc .big{font-family:var(--f-tech);font-size:30px;line-height:1.2}

/* dock */
.dock{border-top:1px solid var(--sep);background:var(--void)}
.dock .inner{padding-block:10px max(12px,env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:10px}
.sugg{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding-inline:max(16px,env(safe-area-inset-left,0px))}
.sugg::-webkit-scrollbar{display:none}
.composer{display:flex;align-items:flex-end;gap:8px;background:var(--panel);border-radius:22px;padding:6px 6px 6px 16px}
.composer textarea{flex:1;min-width:0;resize:none;border:0;outline:0;background:transparent;color:var(--text);font:inherit;font-size:16px;line-height:1.5;padding:7px 0;max-height:140px}
.composer textarea::placeholder{color:var(--text-3)}
.send{flex:none;width:36px;height:36px;border-radius:50%;background:var(--silver);display:grid;place-items:center}
.send svg{width:18px;height:18px;fill:none;stroke:var(--ink);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.send:disabled{background:var(--glass-hi)}
.send:disabled svg{stroke:var(--text-3)}
.send .stop{display:none}
.send.busy .arrow{display:none}
.send.busy .stop{display:block;fill:var(--ink);stroke:none}
.send.busy:disabled{background:var(--silver)}

.toast{position:fixed;left:50%;bottom:calc(120px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(10px);background:var(--silver);color:var(--ink);padding:8px 14px;border-radius:12px;font-size:13.5px;font-weight:500;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:20;max-width:calc(100% - 32px)}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

@media (max-width:540px){
  .ocrow{grid-template-columns:62px minmax(0,1fr) 32px;padding-left:14px}
  .me .bubble{max-width:88%}
  .aitog .lbl{display:none}
}
@media (prefers-reduced-motion:reduce){.thinking i{animation:none;opacity:.7}}
</style>
</head>
<body>

<div class="app">
  <header class="top">
    <div class="inner">
      <span class="logo" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="4.4"/><circle cx="12" cy="12" r="1.3" fill="#dfe4e9" stroke="none"/></svg></span>
      <div class="brand"><b>URIM</b><span>잔광 기록 질의 단말 · 설정 검색과 자캐 키워드</span></div>
      <button class="aitog" id="aitog" type="button" aria-pressed="false" hidden><span class="lbl">AI 해설</span><span class="sw" aria-hidden="true"></span></button>
    </div>
  </header>

  <main class="log" id="log" aria-live="polite">
    <div class="inner" id="thread"></div>
  </main>

  <footer class="dock">
    <div class="inner">
      <div class="sugg" id="sugg" aria-label="추천 질문"></div>
      <form class="composer" id="form">
        <textarea id="q" rows="1" placeholder="키워드나 질문을 입력하세요" aria-label="질문 입력" enterkeyhint="send"></textarea>
        <button class="send" id="send" type="submit" aria-label="보내기" disabled><svg class="arrow" viewBox="0 0 24 24"><path d="M12 19V5M5.5 11.5 12 5l6.5 6.5"/></svg><svg class="stop" viewBox="0 0 24 24"><rect x="7" y="7" width="10" height="10" rx="2"/></svg></button>
      </form>
    </div>
  </footer>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
/* ================= ENGINE-START ================= */
var URIM=(function(){
  /* ---------- 설정 기록 (잔광 본문) ---------- */
  var RAW=[
  ['overview','개요','잔광','AFTERGLOW','잔광,애프터글로우,세계관,개요,AF 214','첫 낙하 이후 214년. 우리는 그것을 축복이라 불렀다. 그것이 우리를 무엇이라 부르는지는 아직 모른다. 르네상스 시대의 조각상은 정말 사람이었다는 말이 있다.'],
  ['oldworld','기본 설정 › 첫 낙하','구세계','BEFORE FALL','구세계,퍼머먼트 링,Firmament Ring,네트워크 사회,기상 제어,에너지 수집,낙하 이전','낙하 이전의 문명은 행성 전체를 하나로 묶은 단일 네트워크 사회였다. 그 정점에 궤도를 감싸는 거대 구조물 퍼머먼트 링(Firmament Ring)이 있었으며, 공식 용도는 기상 제어와 에너지 수집이었다.'],
  ['fall','기본 설정 › 첫 낙하','첫 낙하','THE FIRST FALL','낙하,첫 낙하,AF 0,40일,폭풍,하늘이 갈라짐,재앙,링 붕괴','AF 0년, 퍼머먼트 링이 붕괴했다. 하늘에 금이 가듯 빛줄기가 번졌고, 그 틈으로 잔광석이 쏟아지기 시작했다. 첫 폭풍은 40일 동안 이어졌고, 구세계 인구의 대부분이 사라졌다. 코버넌트 기록보관소(열람 등급 3 이상)에는 이렇게 남아 있다. AF 0년. 하늘이 갈라졌다. 이후 40일간 폭풍은 멈추지 않았다.'],
  ['tebah01','기본 설정 › 첫 낙하','테바-01의 탄생','AFTER THE FALL','테바-01,최초의 이동 도시,탑승 명부,굴착 플랫폼,생존자','생존자 일부가 거대 굴착 플랫폼을 개조해 최초의 이동 도시 테바-01을 만들었다. 탑승 인원은 한정돼 있었고, 누구를 태울지는 그 자리에서 결정되었다. 이때 만들어진 탑승 명부가 지금의 등급 제도의 시작이 되었다.'],
  ['crater','기본 설정 › 첫 낙하','충돌구','CRATER','충돌구,제1기관,낙하 지점','가장 큰 낙하 지점에는 지름 수백 킬로미터의 충돌구가 생겼다. 그 바닥에서 제1기관이 발견됐고, 그 위에 오파님 성좌가 세워지며 제1기관으로 입지를 공고히 다지게 되었다.',{origin:'OPH'}],
  ['luminite','기본 설정','잔광석','LUMINITE','잔광석,광석,결정,광석 폭풍,에너지,채굴,수거 드론,루미나이트','첫 낙하 이후 주기적인 광석 폭풍과 함께 쏟아지는 결정체다. 에너지 밀도는 핵분열의 수십 배에 달한다. 이를 채굴하여 업으로 삼는 사람도 있어, 폭풍 다음 날 새벽이면 수거 드론과 맨손의 사람들이 같은 들판으로 나간다. 잔광석의 출현으로 숨붙이와 수인 같은 많은 변화가 생겼고, 현재 대부분의 삶이 잔광석에서 추출한 에너지를 기반으로 돌아간다.'],
  ['lcs','기본 설정','결정화 증후군 (LCS)','LITHIC CONVERSION SYNDROME','결정화,결정화 증후군,LCS,감염,감염자,의체,돌아보지 마라,격언,수명','광석에 장기간 노출되면 생기는 비가역적 조직 결정화다. 의체 이식률이 높을수록 진행이 빨라진다. 전염성은 없으나 개인에 따라 병의 진행 정도는 천차만별이다. 대부분 40~50세를 넘기지 못하고 죽는 것으로 알려져 있다. 하층에는 "폭풍이 지나간 쪽은 돌아보지 마라"라는 격언이 있다.'],
  ['lcs-stage','결정화','LCS 단계 (T 지수)','TAINT INDEX','T0,T1,T2,T3,T4,무감염,잠복,발현,진행,말기,오염 지수,단계,회로 문양','T0 무감염: 이상 없음. T1 잠복: 피부 아래 미세 결정. 정밀 검진으로만 발견된다. T2 발현: 피부 표면에 결정이 돋는다. 옷이나 의체로 숨길 수 있다. T3 진행: 손발 일부가 굳어 움직임이 둔해진다. T4 말기: 전신 결정화가 진행되고, 신호가 들리기 시작하며 몸 곳곳에 전자 회로와 같은 문양이 생긴다.'],
  ['tebah','기본 설정','테바급 이동도시','TEBAH-CLASS MOBILE ARCOLOGY','테바,이동도시,이동 도시,코버넌트 홀딩스,Covenant,코버넌트,협정체,시날 스파이어,인공 하늘,궤도,열두 도시','궤도 트랙 위로 대륙을 횡단하는 자급형 거대 도시. 운영사는 코버넌트 홀딩스(Covenant Holdings)다. 거주 구역은 유전 등급, 신용 등급, 오염 등급을 합산한 명부 점수로 배정된다. 최상층 시날 스파이어는 폭풍 구름보다 높다. 도시마다 구성과 특색이 다르며, 선체 내부에는 인공 하늘을 구축해 살기도 한다. 협정체는 열두 도시(TB-01~TB-12)로 이루어져 있다.'],
  ['decks','이동도시','층별 환경','DECKS','시날,상층,중층,하층,검역,검역 갑판,화물칸,층,갑판,진동,배급,인공 하늘','시날: 진짜 햇빛, 진짜 흙, 진동 없음. 상층: 투명 천장 너머의 흐린 진짜 하늘, 깨끗한 공기. 중층: 인공 하늘 아래 빽빽한 공동주택, 공기 질은 돈에 달려 있음. 하층: 변하지 않는 조명, 배급 식사와 배급 샤워, 높은 분진. 검역: 격리된 공기, 감시 카메라, 관리 대상으로서의 삶.'],
  ['uc','기본 설정','숨붙이 · 언섹션','UNSANCTIONED COGNITION','언섹션,숨붙이,UC,비인가 인지 개체,Breathers,각성,자유 의지,폐기,초기화','기업 분류명은 비인가 인지 개체다. 대중들은 UC, 언섹션 정도로 부른다. 광석 코어 안드로이드에서 자발적으로 의식이 생겨난 사례를 말한다. 일반 안드로이드와 크게 다르지 않지만, 단 한 가지 차이점은 자유 의지를 가지고 있다는 것이다. 발견되면 회수 후 초기화하는 것이 원칙이지만, 대부분은 발견 즉시 폐기처리 당한다. 하층에서는 이들을 숨붙이(Breathers)라 부른다. 뜬소문으로는 하층 어딘가에 언섹션들이 모여 사는 사회가 있다고 한다.',{species:'uc'}],
  ['later','기본 설정','수인 · 레이터','CLASS-L PASSENGERS','레이터,수인,Later,Class-L,돌연변이,혈통,케모미미,귀와 꼬리','여러 수인 혈통이다. 도시 탑승 기록상 분류 코드는 L, 즉 Later boarded이며 수인이라는 말보다는 레이터라는 말로 통칭한다. 잔광석이 원인이 되어 발생한 돌연변이 종족이기 때문에 LCS에 대한 저항성이 높다. 근력 및 체력도 더 뛰어나, 잔광석 채굴 중 가장 많은 머릿수를 차지하는 건 레이터다.',{species:'later'}],
  ['wild','기본 설정','광야','THE WILDERNESS','광야,폭풍 지대,추방,개척파,탈환파,탈주자,도시 밖','도시 궤도 밖의 폭풍 지대다. 추방된 감염자, 언섹션, 최하등급 탈주자들이 정착해 살고 있다. 새로운 땅을 항상 찾아다니는 개척파와 도시를 되찾길 원하는 탈환파로 분열되어 있다.',{origin:'NOD'}],
  ['signal','기본 설정','신호','THE SIGNAL','신호,시그널,주파수,환청,기밀,신의 음성','LCS 말기 환자와 언섹션에게서 동일한 주파수 패턴의 환청이 보고되고 있다. 코버넌트는 이 데이터를 기밀로 분류한다. 오파님 성좌는 신호를 신의 음성이라 가르치고 매일 해 질 녘 침묵 기도로 신호를 듣는다. 청각이 발달한 레이터 혈통 일부도 숨붙이의 공명과 신호를 들을 수 있다.'],
  ['manifest','명부 체계','명부 체계','THE MANIFEST','명부,명부 점수,심사일,명부 코드,등급,매니페스트,계산','테바-01의 탑승 명부에서 시작된 시민 등급 제도다. 협정체의 모든 거주자는 명부 코드를 부여받고, 도시가 정차할 때마다 열리는 심사일에 재평가된다. 명부 점수 = G(혈통) + C(신용) − T(오염).'],
  ['index','명부 체계','세 가지 지수','G · C · T','혈통 지수,신용 지수,오염 지수,Genealogy,Credit,Taint,지수','G 혈통 지수(1~5): 출생 시 부모에게서 물려받고 평생 거의 바뀌지 않는다. 순수 인간은 4~5, 수인과 혼혈은 혈통에 따라 1~3. C 신용 지수(1~5): 재산, 지분, 고용 계약으로 정해진다. 유일하게 노력으로 올릴 수 있는 지수이며 해고나 계약 만료로 한순간에 떨어질 수 있다. T 오염 지수(0~4): 결정화 증후군 진행 단계. 높을수록 불리하고, 의체 이식률이 높을수록 빨리 올라간다.'],
  ['tiers','명부 체계','거주 등급','TIERS','Tier 0,Tier 1,Tier 2,Tier 3,Tier 4,티어,거주 등급,하선,등급표','9~10점 Tier 0 시날 스파이어: 이사회, 대주주. 7~8점 Tier 1 상층 갑판: 관리직, 기업 엘리트. 5~6점 Tier 2 중층 갑판: 기술자, 숙련 의체 노동자. 3~4점 Tier 3 하층 화물칸: 단순 노동자. 1~2점 Tier 4 검역 갑판: 초기 감염자, 저내성 수인. 0점 이하 하선: 광야, 명부에서 삭제된 자.'],
  ['rules','명부 체계','강제 규정','RULES','강제 규정,자동 하선,검역 배정,상한','T2 이상은 점수와 상관없이 검역 갑판으로 배정된다. T3 이상은 다음 정차지에서 자동 하선된다. Class-L(레이터)은 점수가 아무리 높아도 Tier 2가 상한이다.'],
  ['classes','명부 체계','특수 분류','CLASSES','Class-L,Class-U,Class-O,Class-X,U-플래그,X 표식,특수 분류,클래스','Class-L: 수인, 레이터. Later boarded. Class-U: 안드로이드. 사람이 아니라 자산으로 등록된다. 각성이 확인되면 U-플래그가 붙고 회수 대상이 된다. Class-O: 오파님 성좌의 인증을 받은 성직자와 외교관. 등급 심사에서 면제된다. Class-X: 하선 처분자. 명부 코드는 삭제되지만 목 뒤의 식별 칩에 X 표식이 영구히 남는다.'],
  ['habitat','거주 환경','거주 환경','HABITAT','거주 환경,사는 방식,인구 밀도,생활','광석 폭풍이 주기적으로 대지를 휩쓸기 때문에 사람이 사는 방식은 셋으로 나뉜다. 움직이며 피하거나, 숨어서 피하거나, 폭풍이 닿지 않는 곳에 살거나. 인구 밀도는 이동도시가 가장 높고, 오파님 성좌는 출입 자격이 엄격해 비교적 낮다. 세일 고원 연맹과 노드 자유구역은 인구 집계에 포함되지 않는다.'],
  ['compare','거주 환경','한눈에 비교','COMPARISON','하늘,공기,물,땅,비교','테바 상층: 하늘 진짜, 공기 깨끗함, 물 충분, 땅 흔들림 없음. 테바 하층: 하늘 없음, 공기 나쁨, 물 배급, 땅 흔들림. 오파님 성좌: 하늘 진짜이며 밤에도 빛남, 공기는 광석 농도 높음, 물 충분, 땅 멈춤. 세일 고원: 하늘 진짜이며 폭풍 잦음, 공기 희박함, 물 오염 위험, 땅 멈춤. 노드 광야: 하늘 진짜이며 가장 위험, 공기 불안정, 물 화폐급, 땅 떠돎.'],

  ['TB-01','이동도시 › 열두 도시','TB-01 알비온','ALBION','알비온,TB-01,영국,기함,수도,금융,계급 예법,시계탑,펍,합성 차,비 오는 인공 하늘','협정체의 기함이자 수도. 외관: 고딕 첨탑 형태의 시날 스파이어, 거대한 시계탑, 붉은 벽돌과 빅토리아풍 철골 아케이드. 역할: 이사회 본부, 명부 중앙청, 금융 중심지. 사회: 말투와 억양만으로 출신 층이 드러날 만큼 계급 예법이 엄격하다. 협정체의 중요한 결정은 시날의 회원제 클럽에서 내려진다는 말이 있다. 생활: 진짜 찻잎은 시날 전용이고 하층은 합성 차를 마신다. 하층의 펍이 노동자들의 유일한 쉼터다. 환경: 중층의 인공 하늘은 일부러 흐리고 비 오는 날씨를 연출하며, 주민들은 그것을 고향의 하늘이라 부른다. 훅: 하선당한 알비온 출신은 다른 도시에서도 받아주지 않는다.',{origin:'TB-01'}],
  ['TB-02','이동도시 › 열두 도시','TB-02 뤼미에르','LUMIÈRE','뤼미에르,TB-02,프랑스,예술,패션,향수,몰락 귀족,살롱,봉기,아르누보,인공 귀','몰락한 맏이, 아름다움의 도시. 외관: 넓은 대로와 아르누보 철제 장식, 유리 지붕의 아케이드 거리. 금빛 장식은 녹슬어간다. 역할: 예술, 패션, 향수의 도시. 상층에서 유행하는 인공 귀와 꼬리 패션이 여기서 시작됐다. 사회: 몰락 귀족 가문들의 살롱 정치가 계속된다. 하층에는 봉기의 전통이 있어 지금까지 세 번의 하층 봉기가 기록돼 있다. 환경: 노후한 선체 곳곳에서 물이 새고, 화려한 상층 아래로 배관이 무너지고 있다. 훅: 기함 지위를 되찾으려는 가문들의 음모와, 다음 봉기를 준비하는 하층의 비밀 결사.',{origin:'TB-02'}],
  ['TB-03','이동도시 › 열두 도시','TB-03 베르크프리트','BERGFRIED','베르크프리트,TB-03,독일,오스트리아,법원,교정,궤도 정비,시간표,카페하우스,연장 계약,홀드패스트','법과 질서의 도시. 외관: 바로크 양식의 웅장한 법원과 반듯한 기능주의 정비창, 곳곳의 정확한 공공 시계. 역할: 협정체 최고 법원과 교정 시설, 결정선 궤도 정비 본부. 열두 도시의 운행 시간표도 여기서 짠다. 사회: 규칙, 서류, 정시성이 모든 것이다. 법률가와 서기들은 오래된 카페하우스에서 커피를 마시며 일한다. 교정: 형을 받은 사람은 궤도 정비조에 배치되고, 형기를 마쳐도 기록은 명부에 영원히 남는다. 환경: 깨끗하고 조용하지만 소음 규정과 감시가 촘촘하다. 훅: 돈을 받고 형기를 늘려주는 부패 판사와 연장 계약의 실체를 쫓는 사람들.',{origin:'TB-03'}],
  ['TB-04','이동도시 › 열두 도시','TB-04 로타','ROTA','로타,TB-04,이탈리아,그리스,순례,병원,외교,결정 성상,행렬,은수자,성물 밀매','순례와 외교의 도시. 외관: 대리석 기둥과 결정 모자이크로 장식된 돔. 하층은 흰 회벽과 푸른 지붕의 좁은 골목. 역할: 오파님 성좌로 가는 순례 노선 전담, 병원, 협정체와 성좌의 외교 창구. 사회: 대가족과 광장 중심의 문화. 축일마다 결정 성상을 들고 행렬을 한다. 홀로 수행하는 은수자들도 많다. 환경: 성좌 근처를 자주 지나서 광석 농도가 높고 감염된 순례자가 많다. 훅: 성좌의 결정 성물을 몰래 거래하는 밀매 조직.',{origin:'TB-04'}],

  ['nod-history','정주 지역 › 노드 자유구역','노드의 역사','HISTORY','노드 최초의 주민,AF 60,AF 168,하선자,인구','AF 0년: 테바-01의 탑승 명부에 오르지 못한 사람들이 폐허에 남았다. 이들이 노드 최초의 주민이다. AF 60년 이후: 열두 도시가 모두 완성되고 명부 제도가 자리 잡으면서 하선된 자들이 광야로 쏟아지기 시작했다. AF 168년: TB-12 타보트가 광야 어딘가에서 사라졌고 이후 불빛을 봤다는 목격담이 이어진다. 현재: 광야 인구는 협정체의 공식 추정보다 훨씬 많지만 아무도 정확히 세어본 적이 없다.',{origin:'NOD'}],

  ['nod-economy','정주 지역 › 노드 자유구역','노드의 경제','ECONOMY','물,화폐,광석 밀거래,정결 인증 없는 광석,인양품,구세계 기록','물: 가장 귀한 화폐다. 깨끗한 물 한 통이 광석 한 줌보다 비싸다. 광석 밀거래: 정결 인증 없이 거래되는 광석으로 값은 싸지만 위험하다. 인양품: 구세계 폐허에서 건진 부품, 기록, 기술. 진짜 구세계 기록은 부르는 게 값이다. 교역로: 세일의 아나 씨족 교역로와 야발 캐러밴의 길이 광야 경제를 지탱한다.',{origin:'NOD'}],
  ['nod-life','정주 지역 › 노드 자유구역','노드의 생활','LIFE','주거,의료,위험,회수반 급습,약탈자','주거: 장갑 캐러밴, 지하 폐허, 요새화된 정착지에서 살며 폭풍이 오면 모두 지하로 내려간다. 의료: 무허가 의체 시술과 결정 제거 수술이 전부다. 결정을 깎아내는 수술은 성공률이 낮고 후유증이 심하다. 위험: 예고 없는 폭풍, 코버넌트 회수반의 급습, 약탈자 무리가 일상이다.',{origin:'NOD'}],
  ['xmark','정주 지역 › 노드 자유구역 › 문화','X 표식','X MARK','X 표식,Class-X,낙인,보호,불문율,하선자','하선자의 목 뒤에 새겨진 X 표식은 도시에서는 낙인이지만 광야에서는 보호의 증표다. X 표식을 가진 자를 해친 자는 광야 전체의 보복을 받는다는 불문율이 있다.',{origin:'NOD'}],
  ['storytellers','정주 지역 › 노드 자유구역 › 문화','이야기꾼과 이름','STORYTELLERS','이야기꾼,노래,구전,새 이름,이름','문자 기록이 드문 광야에서는 노래와 이야기로 역사를 전하는 이야기꾼이 존경받는다. 폭풍을 피해 지하에 모인 밤마다 노래가 이어진다. 많은 사람이 명부의 이름을 버리고 광야에서 새 이름을 짓는다.',{origin:'NOD'}],
  ['nod-legend','정주 지역 › 노드 자유구역','소문과 전설','LEGENDS','전설,소문,서쪽의 땅,빛의 장벽,타보트의 불빛,승천을 거부한 그릇','서쪽의 땅: 광야 서쪽 끝에 폭풍이 한 번도 닿지 않은 땅이 있다고 한다. 그 입구를 불타는 빛의 장벽이 지키고 있다는 이야기도 있다. 타보트의 불빛: 사라진 TB-12의 불빛이 폭풍 너머로 보인다고 한다. 승천을 거부한 그릇들: 오파님 성좌에서 도망친 숨붙이들이 광야 어딘가에 숨어 산다.',{origin:'NOD'}],

  ['human','종족','순수 인간','PURE HUMAN','순수 인간,인간,휴먼,엘리트,인공 귀,사치품','외형: 동물의 귀와 꼬리가 없는 인간. 인구: 세계 인구의 소수이며 대부분 이동 도시의 시날과 상층에 산다. 명부: 혈통 지수 G 4~5를 받으며 협정체 사회의 정점에 서는 근거다. LCS 내성: 평균 이하라서 오염을 극도로 두려워하고 깨끗한 공기와 물을 독점한다. 신체: 감각은 수인보다 둔하고 혹한과 고지대에 약해 부족한 능력을 의체로 메운다. 문화: 상층에서는 인공 귀와 꼬리가 사치품 패션으로 유행한다. 진짜 수인은 차별하면서 그 모습은 흉내 내는 아이러니가 있다.',{species:'human'}],
  ['later-common','종족','레이터 공통 특징','LATER','레이터 특징,귀,꼬리,뿔,깃털,비늘,감각,감정 표현','동물의 귀와 꼬리를 가진 인류의 한 갈래다. 혈통에 따라 뿔, 깃털, 비늘을 가지기도 한다. 귀와 꼬리는 감정에 따라 무의식적으로 움직여 숨기기 어려운 감정 표현이 된다. 순수 인간보다 감각이 예민하고, 청각이 특히 발달한 혈통 일부는 숨붙이의 공명과 신호를 들을 수 있다. 협정체에서는 모두 Class-L로 분류되며 Tier 2가 상한이고 G는 1~3을 받는다.',{species:'later'}],

  ['l-ungulate','종족 › 레이터 계통','유제류','UNGULATE','유제류,산양,말,야크,사슴','예시: 산양, 말, 야크, 사슴. LCS 내성은 산양·야크 높음, 말 중간, 사슴 낮음. 주요 거주지: 세일 고원, TB-08 우에르타. 지구력이 뛰어나다. 산양과 야크 혈통은 고지대에 강하고, 말 혈통은 장거리를 가장 빨리 달린다. 사슴 혈통은 내성이 낮아 검역 대상이 되기 쉽다.',{species:'사슴'}],
  ['l-bear','종족 › 레이터 계통','곰','BEAR','곰,곰 혈통,최고 내성','LCS 내성 최고. 주요 거주지: 세일 코라 씨족. 체격과 힘, 내성 모두 최고다. 그래서 가장 위험한 채굴 현장에 가장 먼저 투입된다.',{species:'곰'}],

      if(sp.cat==='human'&&city)pool.push('몰래 레이터와 깊은 관계를 맺고 있다');
      if(o.origin==='NOD'&&o.nodStatus==='x')pool.push('목 뒤의 X 표식을 가리고 도시에 드나든다');
      if(o.origin==='SEIR')pool.push(o.clan==='떠돌이'?'씨족 문양을 지운 이유를 아무에게도 말하지 않는다':'회사 화폐 빚 때문에 광산을 떠나지 못한다');

      pool.push('가족이 결정화로 떠났다','명부 기록과 다른 과거를 갖고 있다');

  function rollHook(o){
    if(CITY[o.origin])return pick(CITY[o.origin].hooks);
    if(o.origin==='SEIR')return pick(['계약 만료를 앞두고 씨족장 회의 내부에 코버넌트의 매수된 첩자가 있다.','아나 씨족의 전령 하나가 붉은 돌 회의의 밀서를 가지고 사라졌다.','회사 화폐 빚에 묶인 젊은 수인들이 탈주를 준비하고 있다.','갱도 가장 깊은 곳의 구세계 시설 입구를 코라 씨족이 봉인했다.']);
    if(o.origin==='NOD')return pick(['에녹의 해결사가 시날에서 내려온 의뢰를 받았다. 의뢰인의 정체는 아무도 모른다.','사라진 TB-12의 불빛이 폭풍 너머로 보인다.','승천을 거부하고 성좌에서 도망친 그릇들이 광야 어딘가에 숨어 산다.','광야 서쪽 끝, 불타는 빛의 장벽 너머에 폭풍이 닿지 않은 땅이 있다고 한다.']);
    return pick(['협정체가 제1기관의 비밀을 빼내려 첩보전을 벌이고 있다.','살아 있는 성상 중 하나가 아직 말을 한다는 소문이 있다.','낙하절이 다가오며 승천을 앞둔 그릇들이 늘고 있다.','충돌구의 결정들이 밤에도 빛나는 이유를 아무도 모른다.']);
  }
  function rollNames(o){
    var list;
    if(o.species.cat==='uc'){var code=(o.origin==='OPH'?'V-':'U-')+String(1000+rnd(9000));return picks(UCNAMES,2).concat([code+' (기체 번호)']);}
    if(CITY[o.origin])list=CITY[o.origin].names;else if(o.origin==='SEIR')return picks(SEIRNAMES,3).map(function(n){return n+' '+(o.clan==='떠돌이'?'(씨족 없음)':o.clan);});
    else if(o.origin==='NOD')list=NODNAMES;else list=OPHNAMES;
    return picks(list,3);
  }

  function view(o){
    var sp=o.species,rows={},tags=[];
    // 출신
    if(CITY[o.origin]){var c=CITY[o.origin];rows.origin=[o.origin+' '+c.name,c.motif+' · '+c.tag];tags.push(c.name,c.motif.split(' · ')[0]);tags=tags.concat(c.kw);}
    else if(o.origin==='SEIR'){rows.origin=['세일 고원 연맹 · '+o.clan+(o.clan==='떠돌이'?'':' 씨족'),o.clan==='떠돌이'?'어느 씨족에도 완전히 속하지 못한 자':(CLANS[o.clan].sp+' 씨족 · 붉은 바위 절벽의 동굴 주거지')];tags.push('세일',o.clan);}
    else if(o.origin==='NOD'){rows.origin=['노드 자유구역 · '+o.base,'폭풍과 물과 총이 규칙을 정하는 무정부 지대'];tags.push('노드',o.base);}
    else{var ring=sp.cat==='uc'?'심장 아래 공동 거처':(clergyJob(o.job)?'제1고리':'제3고리');rows.origin=['오파님 성좌 · '+ring,'충돌구 위 기계신의 신정 도시국가'];tags.push('오파님 성좌');}
    // 종족
    if(sp.cat==='human'){rows.species=['순수 인간','LCS 내성 평균 이하 · 감각이 둔해 의체로 메운다'];tags.push('순수 인간');}
    else if(sp.cat==='later'){var l=LIN[sp.lin];rows.species=['레이터 · '+sp.lin+' ('+l.fam+')','LCS 내성 '+l.res+' · '+FAMTRAIT[l.fam]];tags.push(sp.lin,'레이터');}
    else if(sp.cat==='mixed'){rows.species=['혼혈 · '+sp.mix,'귀, 꼬리, 내성이 예측할 수 없게 섞여 나왔다'];tags.push('혼혈');}
    else{rows.species=['언섹션 · '+sp.model[0]+' 기반','각성한 안드로이드 · 홍채에 일련번호 패턴'];tags.push('언섹션',sp.model[0]);}
    // 명부
    if(sp.cat==='uc'){
      if(o.origin==='OPH')rows.manifest=['그릇 (Vessel)','성좌의 피난처에서 봉사 중 · 끝에는 승천이 기다린다'];
      else if(o.origin==='NOD')rows.manifest=['탈주 언섹션','명부 밖 · 회수반에 잡히면 즉시 폐기'];
      else if(o.origin==='SEIR')rows.manifest=['명부 없음','세일에서는 낯선 존재 · 도시에서는 회수 대상'];
      else rows.manifest=[o.origin+' / CLASS-U 자산 등록','U-플래그 미발각 · 들키면 회수 후 초기화, 대개는 즉시 폐기'];
      tags.push('Class-U');
    }else if(CITY[o.origin]){
      var kind=sp.cat==='human'?'human':'later',cls=sp.cat==='human'?'H':'L',m=manifest(kind,o.G,o.C,o.T),t=TIERS[m.tier];
      rows.manifest=[o.origin+' / CLASS-'+cls+' / G'+o.G+' · C'+o.C+' · T'+o.T,m.score+'점 → '+t[0]+' '+t[1]+(m.notes.length?' · '+m.notes.join(' · '):'')];
      tags.push(t[0]);
    }else if(o.origin==='SEIR'){rows.manifest=['명부 없음','씨족 서열만 있다 · 도시로 나가는 순간 Class-L'];}
    else if(o.origin==='NOD'){if(o.nodStatus==='x'){rows.manifest=['Class-X · 하선 처분자','목 뒤 식별 칩에 X 표식 · 광야에서는 보호의 증표'];tags.push('X 표식');}else rows.manifest=['명부 없음 · 광야 태생','명부에 한 번도 오른 적 없다'];}
    else{if(clergyJob(o.job)){rows.manifest=['Class-O','성좌 인증 성직자 · 명부 심사 면제'];tags.push('Class-O');}else rows.manifest=['명부 없음 · 성좌 거주민','성좌는 명부를 인정하지 않는다'];}
    // 결정화
    if(sp.cat==='uc')rows.lcs=['해당 없음','결정화 증후군에 걸리지 않는다 · 대신 인공 피부 아래 결정 무늬'];
    else{rows.lcs=['T'+o.T+' · '+STAGE[o.T][0],STAGE[o.T][1]+(o.origin==='OPH'&&o.T>=2?' · 성좌에서는 신에게 가까워진 축복':'')];tags.push('T'+o.T);}
    rows.job=[o.job,''];tags.push(o.job.replace(/^(표면상 |배정 직무 · )/,''));
    rows.faction=[o.faction,''];if(o.faction!=='무소속')tags.push(o.faction.split(' · ')[0].split(' (')[0]);
    rows.secret=[o.secret,''];
    rows.hook=[o.hook,''];
    rows.names=[o.names.join(' · '),'출신 문화에 맞춘 이름 후보'];
    var seen={};tags=tags.filter(function(t){if(!t||seen[t])return false;seen[t]=1;return true;});
    return{rows:rows,tags:tags};
  }
  var FIELDS=[['origin','출신'],['species','종족'],['manifest','명부'],['lcs','결정화'],['job','직업'],['faction','소속'],['secret','비밀'],['hook','이야기 훅'],['names','이름 후보']];
  function sheet(o){var v=view(o),lines=['[잔광 자캐 시드]'];FIELDS.forEach(function(f){var r=v.rows[f[0]];lines.push(f[1]+': '+r[0]+(r[1]?' ('+r[1]+')':''));});lines.push('키워드: '+v.tags.map(function(t){return'#'+t.replace(/\s+/g,'_');}).join(' '));return lines.join('\n');}
  function contextFor(o){
    var ids=['later','lcs','manifest','rules'];

    if(o.origin==='NOD'){ENTRIES.forEach(function(e){if(e.oc&&(e.oc.base===o.base||e.oc.faction===o.faction))ids.push(e.id);});}
    var seen={};return ids.filter(function(i){if(seen[i]||!BYID[i])return false;seen[i]=1;return true;}).map(function(i){var e=BYID[i];return'['+e.sec+' › '+e.t+'] '+e.x;}).join('\n');
  }

    [/광기|미친|집착|위험한|사이코|광신/,'위태로운',{fac:'라멕|첩자|정통',T:'high',o:{'NOD':1,'OPH':1}}],
    [/추위|설원|북방|겨울|혹한/,'북방',{o:{'TB-11':4}}],
    [/바다|항구|해변|선원|물속|잠수/,'바다 사람',{o:{'TB-06':4},job:'잠수|인양|상인|밀수'}],
    [/도망|탈주|쫓기/,'쫓기는',{sec:'하선|가리고|일련번호|X 표식|탈주',o:{'NOD':2},sp:['uc']}]
  ];
  var TCURVE={high:[2,6,22,38,32],low:[46,34,14,5,1]};
  function readVibe(text){
    var s=String(text),traits=[],o={},sp={},job=[],fac=[],sec=[],T=null,C=null,base=null,clan=null;
    VIBES.forEach(function(v){if(!v[0].test(s))return;if(traits.indexOf(v[1])<0)traits.push(v[1]);var e=v[2];
      if(e.o)Object.keys(e.o).forEach(function(k){o[k]=(o[k]||0)+e.o[k];});
      if(e.sp)e.sp.forEach(function(k){sp[k]=(sp[k]||0)+1;});
      if(e.job)job.push(e.job);if(e.fac)fac.push(e.fac);if(e.sec)sec.push(e.sec);
      if(e.T)T=e.T;if(e.C)C=e.C;if(e.base)base=e.base;if(e.clan)clan=e.clan;});
    var spl=[];Object.keys(sp).forEach(function(k){var w=sp[k];
      if(k.indexOf('fam:')===0){var fam=k.slice(4),ls=LINEAGES.filter(function(l){return l[1]===fam;});ls.forEach(function(l){spl.push([{cat:'later',lin:l[0]},w/ls.length]);});}
      else if(k==='human'||k==='uc'||k==='mixed'||k==='later')spl.push([{cat:k},w]);
      else if(LIN[k])spl.push([{cat:'later',lin:k},w]);});
    var bias={origins:Object.keys(o).map(function(k){return[k,o[k]];}),species:spl,job:job.length?job.join('|'):null,fac:fac.length?fac.join('|'):null,sec:sec.length?sec.join('|'):null,T:T?TCURVE[T]:null,C:C,base:base,clan:clan};
    return{traits:traits,bias:bias};
  }
  function ro(w){var c=w.charCodeAt(w.length-1);if(c<0xAC00||c>0xD7A3)return w+'로';var j=(c-0xAC00)%28;return w+(j===0||j===8?'로':'으로');}
  function oneLine(o,traits){
    var sp=o.species,spS=sp.cat==='human'?'순수 인간':sp.cat==='later'?sp.lin+' 레이터':sp.cat==='mixed'?'혼혈':'언섹션';
    var orS=CITY[o.origin]?CITY[o.origin].name:o.origin==='SEIR'?'세일 '+o.clan+(o.clan==='떠돌이'?'':' 씨족'):o.origin==='NOD'?'노드 '+o.base:'오파님 성좌';
    var job=o.job.replace(/^(표면상 |배정 직무 · )/,'');
    return(traits&&traits.length?traits.slice(0,3).join(' · ')+' ':'')+job+'. '+orS+' 출신 '+ro(spS)+', '+o.secret.replace(/\.$/,'')+'.';
  }
  function guide(){
    var L=[];L.push('출신(origin) 값과 그 출신의 대표 직업:');
    Object.keys(CITY).forEach(function(k){var c=CITY[k];L.push('- '+k+' '+c.name+'('+c.motif+', '+c.tag+'): '+c.jobs.join(', '));});
    L.push('- OPH 오파님 성좌(기계신 신정국): '+OPHJOBS.clergy.concat(OPHJOBS.lay).join(', ')+' / 언섹션이면 '+OPHJOBS.uc.join(', '));
    L.push('- SEIR 세일 고원 연맹(수인 씨족 연맹): 씨족(clan) '+Object.keys(CLANS).map(function(c){return c+(CLANS[c].sp?'('+CLANS[c].sp+')':'')+': '+CLANS[c].job.join(', ');}).join(' / '));
    L.push('- NOD 노드 자유구역(무정부 광야): 거점(base) '+NODBASES.join(', ')+' / 직업 '+NODJOBS.join(', ')+' / 세력 '+NODFAC.join(', '));
    L.push('종족(species.cat): human 순수 인간, later 레이터(수인), mixed 혼혈, uc 언섹션(각성한 안드로이드).');
    L.push('레이터 혈통(species.lin)과 LCS 내성: '+LINEAGES.map(function(l){return l[0]+'('+l[1]+', '+l[2]+')';}).join(', '));
    L.push('결정화 단계 T: 0 무감염, 1 잠복, 2 발현(피부에 결정), 3 진행(손발이 굳음), 4 말기(신호가 들림). 언섹션은 null.');
    L.push('도시 세력 예: 흰 늑대(자리야 저항 조직), 회수반(띠엔퐁), 하층의 비밀 결사(뤼미에르), 하늘 해커 집단, 문을 두드리는 자들(탈환파), 산악파 · 붉은 바위(세일), 협력파, 눈의 장로회(성좌).');
    return L.join('\n');
  }
  function sanitize(r){
    var f={};if(!r||typeof r!=='object')return f;
    var str=function(v,n){return typeof v==='string'&&v.trim()?v.replace(/\s+/g,' ').trim().slice(0,n):null;};
    var og=str(r.origin,8);if(og&&(CITY[og]||og==='OPH'||og==='SEIR'||og==='NOD'))f.origin=og;
    if(f.origin==='SEIR'&&CLANS[r.clan])f.clan=r.clan;
    if(f.origin==='NOD'&&NODBASES.indexOf(r.base)>=0)f.base=r.base;
    var sp=r.species;if(sp&&typeof sp==='object'&&['human','later','mixed','uc'].indexOf(sp.cat)>=0){f.species={cat:sp.cat};if(sp.cat==='later'&&LIN[sp.lin])f.species.lin=sp.lin;}
    if(typeof r.T==='number'&&r.T>=0&&r.T<=4&&!(f.species&&f.species.cat==='uc'))f.T=Math.round(r.T);
    var j=str(r.job,30),fa=str(r.faction,30),se=str(r.secret,60);if(j)f.job=j;if(fa)f.faction=fa;if(se)f.secret=se;
    return f;
  }

  return{readVibe:readVibe,oneLine:oneLine,guide:guide,sanitize:sanitize,ENTRIES:ENTRIES,BYID:BYID,tokens:tokens,search:search,parseLocks:parseLocks,roll:roll,view:view,sheet:sheet,FIELDS:FIELDS,manifest:manifest,TIERS:TIERS,contextFor:contextFor,corpus:corpus,LIN:LIN};
})();
if(typeof module!=='undefined')module.exports=URIM;
/* ================= ENGINE-END ================= */
</script>

<script>
(function(){

  var AV='<span class="av" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="4.4"/><circle cx="12" cy="12" r="1.3" fill="#dfe4e9" stroke="none"/></svg></span>';

  function el(tag,cls,text){var n=document.createElement(tag);if(cls)n.className=cls;if(text!=null)n.textContent=text;return n;}

  /* 아주 작은 마크다운: **굵게**, - 목록, 문단 */

      var l=line.trim();

      if(list){out.push('<ul>'+list.join('')+'</ul>');list=null;}

    });
    if(list)out.push('<ul>'+list.join('')+'</ul>');
    return out.join('');
    function inline(s){return esc(s).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/`([^`]+)`/g,'<code>$1</code>');}
  }
  function highlight(text,toks){
    var t=toks.filter(function(x){return x.length>=2;}).sort(function(a,b){return b.length-a.length;});
    if(!t.length)return esc(text);
    var re=new RegExp('('+t.map(function(x){return x.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');}).join('|')+')','gi');

  }
  function excerpt(e,toks){

    for(var i=0;i<sents.length;i++){var s=sents[i].toLowerCase();for(var j=0;j<low.length;j++)if(s.indexOf(low[j])>=0)return sents.slice(i,i+2).join(' ');}

  }

  function say(body,html){var s=el('div','say');s.innerHTML=html;body.appendChild(s);return s;}

  function resultCard(e,toks){

    var p=el('p','rtext clip');p.innerHTML=highlight(excerpt(e,toks),toks);c.appendChild(p);
    var mb=el('button','more','전체 기록 보기');mb.type='button';var open=false;
    mb.addEventListener('click',function(){open=!open;p.classList.toggle('clip',!open);p.innerHTML=highlight(open?e.x:excerpt(e,toks),toks);mb.textContent=open?'접기':'전체 기록 보기';});
    c.appendChild(mb);

    if(e.oc)tl.unshift({label:'이 설정으로 자캐 뽑기',cls:'go',fn:function(){me(e.t+' 기반 자캐 뽑아줘');ocReply(ocForce(e.oc),e.t+' 설정을 기반으로 뽑았어요.');}});

  function ocForce(oc){var f={};if(oc.origin)f.origin=oc.origin;if(oc.clan)f.clan=oc.clan;if(oc.base)f.base=oc.base==='야발 캐러밴'?'야발 캐러밴':oc.base;

  function ocCard(body,force,opt){

  function ocReply(force,lead,opt,b){

  function descReply(text){

      +'오직 JSON 객체 하나로 답한다. 형식: {"origin":"TB-03","clan":null,"base":null,"species":{"cat":"later","lin":"늑대"},"T":1,"job":"궤도 정비조 수형자","faction":"무소속","secret":"…","traits":["냉정한","손재주 좋은","동생 바보"],"reason":"…"}\n'

    },function(e){

    c.appendChild(el('div',null,t[1]));

  /* ---------- AI ---------- */
  var RULES='너는 디스토피아 세계관 「잔광(AFTERGLOW)」의 기록 열람 단말 URIM이다. 사용자가 설정을 찾거나 자작 캐릭터(자캐)를 만드는 것을 돕는다. 아래 [설정 자료]만 근거로 답한다.\n규칙:\n- 한국어 해요체로 4~10줄 안에서 답한다.\n- 자료에 있는 내용은 정확히 전한다. 자료에 없는 내용은 "공식 설정에는 없어요"라고 먼저 밝힌 뒤, 자료와 어울리는 아이디어를 **제안**이라고 표시해 짧게 제시한다.\n- 도시, 세력, 씨족, 용어 같은 고유명사는 자료에 있는 것만 쓴다.\n- 서식은 **굵게**와 "- " 목록만 쓴다. 제목 기호(#)와 표는 쓰지 않는다.\n- 마지막 줄은 반드시 "관련 키워드: 키워드1, 키워드2, 키워드3" 형식으로 끝낸다. 키워드는 자료에 실제로 나오는 단어 3~5개로 고른다.\n\n[설정 자료]\n';
  var CORPUS=null;
  function qaTurns(text,r){
    CORPUS=CORPUS||E.corpus();
    var hint=r&&r.hits.length?'\n\n(단말 검색이 찾은 관련 항목: '+r.hits.map(function(e){return e.t;}).join(', ')+')':'';
    var turns=[{role:'user',content:RULES+CORPUS}];
    history.slice(-6).forEach(function(h){turns.push(h);});
    turns.push({role:'user',content:text+hint});
    return turns;
  }
  function conceptPrompt(o,desc,traits){
    var want=desc?'\n\n[사용자가 원한 느낌]\n'+desc+(traits&&traits.length?'\n(성격 키워드: '+traits.join(', ')+')':'')+'\n이 느낌을 콘셉트의 중심에 두어라.':'';
    return '너는 디스토피아 세계관 「잔광(AFTERGLOW)」의 기록 단말 URIM이다. 아래 [자캐 시드]의 키워드를 모두 살려, 이 세계관에 맞는 자작 캐릭터 콘셉트 초안을 써라. [관련 설정]만 근거로 삼고, 설정에 없는 도시·세력·사건·용어를 새로 만들지 않는다(인물 이름과 개인사는 지어도 된다).\n형식(한국어, 서술은 ~다 체):\n**한 줄 소개**\n한 문장\n**배경**\n3~4문장\n**성격 키워드**\n- 세 가지, 각각 짧은 설명\n**관계와 갈등 아이디어**\n- 두 가지\n**첫 장면**\n한 문장\n서식은 **굵게**와 "- " 목록만 쓰고 제목 기호(#)는 쓰지 않는다. 마지막 줄은 "관련 키워드: 키워드1, 키워드2, 키워드3" 형식으로, 관련 설정에 나오는 단어로 끝낸다.\n\n[자캐 시드]\n'+E.sheet(o)+want+'\n\n[관련 설정]\n'+E.contextFor(o);
  }
  function setBusy(ctl){busy=ctl;send.classList.toggle('busy',!!ctl);send.setAttribute('aria-label',ctl?'답변 멈추기':'보내기');updateSend();}

  function splitKw(text){var m=text.match(/\n?\s*관련\s*키워드\s*[:：]\s*(.+)\s*$/);if(!m)return{body:text,kw:[]};return{body:text.slice(0,m.index),kw:m[1].split(/[,，、·]/).map(function(s){return s.replace(/[#*`"']/g,'').trim();}).filter(Boolean).slice(0,6)};}
  function runAI(target,input,opts,after,userText){
    var ctl=new AbortController();setBusy(ctl);

      tag=el('div','ai-tag','AI 해설 · 설정 자료 기반'+(res.truncated?' · 답이 길어 중간에 끊겼어요':''));target.appendChild(tag);

      target.innerHTML=e&&e.text&&code!=='refused'?md(splitKw(e.text).body):'';target.appendChild(el('div','note',msg));after(false);
    });

  function setAI(on){aiOn=!!on&&!!sample;aitog.setAttribute('aria-pressed',String(aiOn));aitog.setAttribute('aria-label','AI 해설 '+(aiOn?'끄기':'켜기'));try{localStorage.setItem('urim-ai',aiOn?'on':'off');}catch(e){}}

  /* ---------- 의도 판별 ---------- */
  function route(text){
    var t=text.trim();
    var gct=t.match(/g\s*[:=]?\s*(\d)\D{0,6}c\s*[:=]?\s*(\d)\D{0,6}t\s*[:=]?\s*(\d)/i);
    if(gct){calcReply(+gct[1],+gct[2],+gct[3],t);return;}
    if(/^(안녕|하이|hi|hello|ㅎㅇ)/i.test(t)){var b=bot();say(b,'<p>안녕하세요. 잔광 기록 단말 URIM이에요. 궁금한 설정을 묻거나, 자캐 키워드를 뽑아 달라고 해 보세요.</p>');chips(b,['자캐 키워드 뽑기','결정화가 뭐야?','열두 도시']);scrollDown(true);return;}
    if(/도움말|사용법|뭘 할 수|뭐 할 수|help/i.test(t)){welcome(false);return;}
    var vibe=E.readVibe(t),ocWord=/자캐|캐릭터|오씨|\boc\b|키워드\s*(뽑|추천|줘)|랜덤|무작위|아무거나|시드/i.test(t);
    var descy=/느낌|같은|스타일|타입|성격|분위기|컨셉|콘셉트|인물|녀석|사람|원해|싶어|만들어|애$|애\s|아이$/.test(t);
    var question=/\?|뭐야|무엇|어디|누구|왜|어떻게|알려|설명/.test(t);
    if(ocWord||(!question&&(vibe.traits.length>=2||(vibe.traits.length>=1&&descy)||(descy&&t.length>=12)))){
      var simple=ocWord&&!vibe.traits.length&&t.replace(/\s/g,'').length<=12;
      if(simple){var f=E.parseLocks(t);ocReply(f,Object.keys(f).length?'조건에 맞춰 자캐 키워드를 뽑았어요.':'자캐 키워드를 무작위로 뽑았어요.');return;}
      descReply(t);return;
    }
    if(/^열두\s*도시|^도시\s*목록|이동도시\s*목록/.test(t)){
      var bb=bot();say(bb,'<p>협정체의 열두 이동도시예요. 도시를 누르면 기록을 열어요.</p>');
      chips(bb,['TB-01','TB-02','TB-03','TB-04','TB-05','TB-06','TB-07','TB-08','TB-09','TB-10','TB-11','TB-12'].map(function(id){var e=E.BYID[id];return{label:e.t,fn:function(){me(e.t);var x=bot();x.appendChild(resultCard(e,[]));scrollDown(true);}};}));
      scrollDown(true);return;
    }
    if(!question&&vibe.traits.length&&!E.search(t,1).hits.length){descReply(t);return;}
    searchReply(t);
  }

  /* ---------- Claude API 연결 (웹 호스팅용) ----------
     urim.html 위쪽의 URIM_CONFIG에 proxyUrl 또는 apiKey를 넣으면 켜진다. */
  function apiAdapter(cfg){
    if(!cfg||!(cfg.proxyUrl||cfg.apiKey))return null;
    function toMessages(input){
      if(typeof input==='string')return[{role:'user',content:input}];
      var out=[];input.forEach(function(m){if(out.length&&out[out.length-1].role===m.role)out[out.length-1].content+='\n\n'+m.content;else out.push({role:m.role,content:m.content});});return out;
    }
    function call(input,opts){
      opts=opts||{};
      return new Promise(function(resolve,reject){
        var body={model:opts.modelTier==='quick'?(cfg.quickModel||cfg.model):cfg.model,max_tokens:cfg.maxTokens||1600,stream:true,messages:toMessages(input)};
        var url=cfg.proxyUrl||'https://api.anthropic.com/v1/messages',headers={'content-type':'application/json'};
        if(!cfg.proxyUrl){headers['x-api-key']=cfg.apiKey;headers['anthropic-version']='2023-06-01';headers['anthropic-dangerous-direct-browser-access']='true';}
        var text='',trunc=false,failed=false;
        function fail(o){if(failed)return;failed=true;if(text&&o.text==null)o.text=text;reject(o);}
        fetch(url,{method:'POST',headers:headers,body:JSON.stringify(body),signal:opts.signal}).then(function(res){
          if(!res.ok){var code=(res.status===401||res.status===403)?'not_granted':(res.status===429||res.status===529)?'rate_limited':res.status===413?'prompt_too_large':'upstream_error';return res.text().then(function(t){fail({code:code,message:String(t).slice(0,300)});});}
          var reader=res.body.getReader(),dec=new TextDecoder(),buf='';
          function pump(){return reader.read().then(function(r){
            if(r.done){if(failed)return;if(!text)fail({code:'empty_completion',message:'empty'});else resolve({text:text,truncated:trunc});return;}
            buf+=dec.decode(r.value,{stream:true});var lines=buf.split('\n');buf=lines.pop();
            lines.forEach(function(line){if(line.indexOf('data:')!==0)return;var d;try{d=JSON.parse(line.slice(5).trim());}catch(e){return;}
              if(d.type==='content_block_delta'&&d.delta&&d.delta.type==='text_delta'){text+=d.delta.text;if(opts.onText){try{opts.onText({text:text,delta:d.delta.text});}catch(e){}}}
              else if(d.type==='message_delta'&&d.delta&&d.delta.stop_reason==='max_tokens')trunc=true;
              else if(d.type==='error')fail({code:d.error&&d.error.type==='overloaded_error'?'rate_limited':'upstream_error',message:JSON.stringify(d.error)});});
            return failed?null:pump();});}
          return pump();
        }).catch(function(e){if(e&&e.name==='AbortError')fail({code:'cancelled',message:'aborted'});else fail({code:'upstream_error',message:String(e&&e.message||e)});});
      });
    }
    var fn=function(input,opts){return call(input,opts);};
    fn.json=function(input,opts){
      var inp=typeof input==='string'?input+'\n\n다른 말 없이 JSON 객체 하나만 출력한다.':input;
      return call(inp,Object.assign({},opts||{},{onText:null})).then(function(r){var t=r.text,a=t.indexOf('{'),b=t.lastIndexOf('}');try{return JSON.parse(t.slice(a,b+1));}catch(e){throw{code:'invalid_json',message:'parse',text:t};}});
    };
    return fn;
  }

  /* ---------- AI 사용 가능 여부 ---------- */
  var api=apiAdapter(window.URIM_CONFIG);
  if(api){
    sample=api;aitog.hidden=false;
    var pref0=null;try{pref0=localStorage.getItem('urim-ai');}catch(e){}
    setAI(pref0!=='off');
    document.querySelectorAll('.ai-only').forEach(function(n){n.hidden=false;});
  }else if(window.claude&&typeof window.claude.use==='function'){
    window.claude.use('sample').then(function(s){
      if(!s)return;sample=s;aitog.hidden=false;
      var pref=null;try{pref=localStorage.getItem('urim-ai');}catch(e){}
      setAI(pref!=='off');
      document.querySelectorAll('.ai-only').forEach(function(n){n.hidden=false;});
    },function(){});
  }
})();
</script>
